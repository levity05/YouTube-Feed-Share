<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Плеер</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Обёртка для встроенного плеера. Страница расширения (chrome-extension://) для YouTube —
      «неизвестный сайт», и плеер падает с ошибкой 152/153. Эта страница лежит на обычном
      https-сайте (там же, где размещённый просмотрщик), поэтому YouTube видит нормальный адрес.
    -->
    <iframe id="yt" title="Плеер YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <script src="player.js"></script>
  </body>
</html>
